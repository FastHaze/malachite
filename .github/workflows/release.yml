# Makes a release when a tag `vX.Y.Z` is pushed: tests, builds the programs
# for Windows, macOS and Linux, and puts them on a GitHub release whose notes
# are that version's part of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.83.0"

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            # The oldest runner, so the program runs on older systems too.
            os: ubuntu-22.04
          - name: macos-universal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the version in Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --release --bins
          dir="malachite-v$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/malachite.exe target/release/malachite-cli.exe README.md LICENSE CHANGELOG.md "$dir/"
          cp -r vault "$dir/vault"
          7z a "$dir.zip" "$dir" > /dev/null
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --bins
          dir="malachite-v$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/malachite target/release/malachite-cli README.md LICENSE CHANGELOG.md "$dir/"
          cp -r vault "$dir/vault"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --bins --target "$target"
          done
          dir="malachite-v$VERSION-${{ matrix.name }}"
          app="$dir/Malachite.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # One program for both kinds of Mac.
          for bin in malachite malachite-cli; do
            lipo -create -output "$dir/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
          mv "$dir/malachite" "$app/Contents/MacOS/malachite"

          # The icon, from the picture of it made square.
          iconset=Malachite.iconset
          mkdir "$iconset"
          sips -p 640 640 assets/malachite-icon.png --out square.png > /dev/null
          for size in 16 32 128 256 512; do
            sips -z $size $size square.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            sips -z $double $double square.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Malachite.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Malachite</string>
            <key>CFBundleDisplayName</key><string>Malachite</string>
            <key>CFBundleIdentifier</key><string>io.github.fasthaze.malachite</string>
            <key>CFBundleExecutable</key><string>malachite</string>
            <key>CFBundleIconFile</key><string>Malachite</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Not signed by Apple: signed for this machine only, which Apple
          # silicon needs for a program to run at all.
          codesign --force --deep --sign - "$app"
          cp README.md LICENSE CHANGELOG.md "$dir/"
          cp -r vault "$dir/vault"
          ditto -c -k --keepParent "$dir" "$dir.zip"
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Take this version's notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" version "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
